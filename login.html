<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso de administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--rosa:#c9567f;--rosa-suave:#fbe3ec;--rosa-claro:#fff4f8;--menta:#d6efea;--verde:#3f948c;--tinta:#3d2c3b;--texto:#665663;--linea:#f1d9e3;--oro-suave:#f3e0cf;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Nunito","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;font-family:var(--sans);color:var(--texto);line-height:1.6;position:relative;overflow:hidden;background:radial-gradient(circle at 15% 20%,#ffd9e6 0,transparent 45%),radial-gradient(circle at 85% 80%,var(--menta) 0,transparent 45%),var(--rosa-suave)}
:focus-visible{outline:3px solid var(--verde);outline-offset:3px;border-radius:8px}
body:before,body:after{content:"";position:absolute;border-radius:50%;filter:blur(45px);opacity:.55;pointer-events:none;animation:flota 9s ease-in-out infinite}
body:before{width:300px;height:300px;background:#ffc2d6;left:-70px;top:-60px}
body:after{width:340px;height:340px;background:#bfe6df;right:-90px;bottom:-70px;animation-delay:-4s}
@keyframes flota{0%,100%{transform:translate(0,0)}50%{transform:translate(28px,22px)}}
.login{position:relative;z-index:1;width:100%;max-width:430px;padding:42px 38px 34px;background:#fff;border:1px solid var(--oro-suave);border-radius:28px 28px 28px 8px;box-shadow:0 18px 50px #c9567f22;opacity:0;transform:translateY(20px);animation:entra .9s cubic-bezier(.2,.7,.2,1) .1s forwards}
@keyframes entra{to{opacity:1;transform:none}}
.logo{width:72px;height:72px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(135deg,var(--rosa),#e59ab6);color:#fff;display:grid;place-items:center;border:5px solid #fff;box-shadow:0 0 0 2px var(--rosa),0 10px 24px #c9567f40;animation:halo 3.5s ease-in-out infinite}
.logo svg{width:32px;height:32px;animation:latido 2.2s ease-in-out infinite;transform-origin:center}
@keyframes halo{0%,100%{box-shadow:0 0 0 2px var(--rosa),0 10px 24px #c9567f40}50%{box-shadow:0 0 0 2px var(--rosa),0 0 0 12px #c9567f1a,0 10px 24px #c9567f40}}
@keyframes latido{0%,60%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}42%{transform:scale(1.08)}}
h1{font-family:var(--serif);font-weight:700;font-size:42px;line-height:1.1;text-align:center;margin:0 0 6px;letter-spacing:.4px;color:var(--tinta)}
.sub{text-align:center;color:var(--texto);margin:0 0 6px}
.ecg{display:block;width:150px;height:26px;margin:0 auto 18px}
.ecg path{fill:none;stroke:var(--rosa);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:300;stroke-dashoffset:300;animation:trazo 2.2s ease-out .6s forwards;opacity:.8}
@keyframes trazo{to{stroke-dashoffset:0}}
label{display:block;margin:16px 0 7px;font-weight:700;font-size:14px;color:var(--tinta)}
input{width:100%;padding:14px 16px;border:1px solid var(--linea);border-radius:14px;font:400 15px var(--sans);color:var(--tinta);background:var(--rosa-claro);outline:none;transition:border-color .25s,box-shadow .25s,background .25s}
input::placeholder{color:#b3a2b0}
input:focus{border-color:var(--rosa);background:#fff;box-shadow:0 0 0 4px #c9567f1f}
button{width:100%;padding:14px;margin-top:24px;border:0;border-radius:30px;background:linear-gradient(110deg,#c9567f,#d97a9b,#c9567f);background-size:200% 100%;color:#fff;font:700 15px var(--sans);cursor:pointer;box-shadow:0 8px 20px #c9567f40;transition:background-position .6s,transform .2s,box-shadow .2s}
button:hover{background-position:100% 0;transform:translateY(-1px);box-shadow:0 12px 26px #c9567f55}
button:active{transform:translateY(0)}
button:disabled{opacity:.65;cursor:not-allowed}
.volver{display:block;text-align:center;margin-top:22px;color:var(--rosa);text-decoration:none;font-size:14px;font-weight:700;transition:color .2s}
.volver:hover{color:#a6406a;text-decoration:underline}
#error{color:#b83a62;text-align:center;min-height:22px;font-size:13px;font-weight:600;margin:12px 0 0}
#error:not(:empty){animation:sacude .4s}
@keyframes sacude{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@media(max-width:480px){.login{padding:34px 24px 28px}h1{font-size:36px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}.login{opacity:1;transform:none}.ecg path{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="login">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>
      <path d="M3.5 12h4l2-3 3 6 2-3h6" stroke-width="1.6"/>
    </svg>
  </div>
  <h1>Bienvenida</h1>
  <p class="sub">Acceso al panel de administración</p>
  <svg class="ecg" viewBox="0 0 150 26" aria-hidden="true"><path d="M0 14 H50 L56 14 L61 5 L67 22 L73 2 L79 19 L84 14 H150"/></svg>
  <form id="form-login">
    <label for="usuario">Usuario</label>
    <input id="usuario" type="text" required autocomplete="username" placeholder="Ingresa tu usuario">
    <label for="clave">Contraseña</label>
    <input id="clave" type="password" required autocomplete="current-password" placeholder="Ingresa tu contraseña">
    <button type="submit" id="btn-ingresar">Ingresar al panel</button>
    <p id="error" aria-live="polite"></p>
  </form>
  <a href="index.html" class="volver">← Volver al inicio</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://jyxohnsvqhhnxcmkwfgg.supabase.co";
const SUPABASE_KEY = "sb_publishable_3La-D-KSxaVYsSYNmd6SSA_M4XkieaD";
const ADMIN_EMAIL = "hademilagritospasminoishuiza@gmail.com";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

(async function comprobarSesion(){
  const {data, error} = await supabaseClient.auth.getSession();
  if(!error && data.session && data.session.user.email === ADMIN_EMAIL){
    window.location.replace("panel-admin.html");
  }
})();

document.getElementById("form-login").addEventListener("submit", async function(evento){
  evento.preventDefault();
  const usuario = document.getElementById("usuario").value.trim();
  const clave = document.getElementById("clave").value;
  const errorElemento = document.getElementById("error");
  const boton = document.getElementById("btn-ingresar");
  errorElemento.textContent = "";

  if(usuario.toLowerCase() !== "hade"){
    errorElemento.textContent = "Usuario o contraseña incorrectos.";
    return;
  }
  boton.disabled = true;
  boton.textContent = "Verificando acceso...";
  try{
    const {data, error} = await supabaseClient.auth.signInWithPassword({
      email: ADMIN_EMAIL,
      password: clave
    });
    if(error) throw error;
    if(!data.session || data.user.email !== ADMIN_EMAIL) throw new Error("No se pudo validar la sesión.");
    window.location.href = "panel-admin.html";
  }catch(error){
    console.error("Error de inicio de sesión:", error);
    errorElemento.textContent = "Usuario o contraseña incorrectos. Verifica tus datos.";
    boton.disabled = false;
    boton.textContent = "Ingresar al panel";
  }
});
</script>
</body>
</html>
